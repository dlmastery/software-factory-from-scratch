<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2563EB"/></marker>
    <marker id="a-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#059669"/></marker>
    <marker id="a-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#DC2626"/></marker>
    <marker id="a-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#9CA3AF"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <g transform="translate(0,-60)">

  <!-- Stage 1: issue -->
  <g>
    <rect x="65" y="200" width="300" height="250" rx="14" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="89" y="238" font-size="15" font-weight="600" fill="#6B7280" letter-spacing="1">1 · INPUT</text>
    <text x="89" y="276" font-size="24" font-weight="700" fill="#1F2937">GitHub issue</text>
    <text x="89" y="304" font-size="17" fill="#6B7280">one ticket from the backlog</text>
    <line x1="89" y1="326" x2="341" y2="326" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="89" y="360" font-size="18" fill="#1F2937">Describes the bug</text>
    <text x="89" y="388" font-size="18" fill="#1F2937">or feature request</text>
    <text x="89" y="416" font-size="18" fill="#1F2937">in plain language</text>
  </g>

  <!-- Stage 2: agent -->
  <g>
    <rect x="455" y="200" width="300" height="250" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="479" y="238" font-size="15" font-weight="600" fill="#2563EB" letter-spacing="1">2 · BUILD</text>
    <text x="479" y="276" font-size="24" font-weight="700" fill="#1F2937">Coding agent</text>
    <text x="479" y="304" font-size="17" fill="#6B7280">Claude Code, headless</text>
    <line x1="479" y1="326" x2="731" y2="326" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="479" y="360" font-size="18" fill="#1F2937">Reads the issue</text>
    <text x="479" y="388" font-size="18" fill="#1F2937">Writes the fix + tests</text>
    <text x="479" y="416" font-size="18" fill="#1F2937">Opens a pull request</text>
  </g>

  <!-- Stage 3: check -->
  <g>
    <rect x="845" y="200" width="300" height="250" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="869" y="238" font-size="15" font-weight="600" fill="#059669" letter-spacing="1">3 · VERIFY</text>
    <text x="869" y="276" font-size="24" font-weight="700" fill="#1F2937">Independent check</text>
    <text x="869" y="304" font-size="17" fill="#6B7280">not the agent that wrote it</text>
    <line x1="869" y1="326" x2="1121" y2="326" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="869" y="360" font-size="18" fill="#1F2937">Clean copy of the repo</text>
    <text x="869" y="388" font-size="18" fill="#1F2937">Re-runs the tests</text>
    <text x="869" y="416" font-size="18" fill="#1F2937">Ignores the self-report</text>
  </g>

  <!-- Stage 4: human -->
  <g>
    <rect x="1235" y="200" width="300" height="250" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
    <text x="1259" y="238" font-size="15" font-weight="600" fill="#1F2937" letter-spacing="1">4 · DECIDE</text>
    <text x="1259" y="276" font-size="24" font-weight="700" fill="#1F2937">Human merges</text>
    <text x="1259" y="304" font-size="17" fill="#6B7280">the only one who can</text>
    <line x1="1259" y1="326" x2="1511" y2="326" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="1259" y="360" font-size="18" fill="#1F2937">Reads PR + test result</text>
    <text x="1259" y="388" font-size="18" fill="#1F2937">Merges or sends back</text>
    <text x="1259" y="416" font-size="18" fill="#1F2937">Decides what ships</text>
  </g>

  <!-- forward arrows -->
  <line x1="367" y1="300" x2="451" y2="300" stroke="#2563EB" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="410" y="286" font-size="15" fill="#6B7280" text-anchor="middle">assign</text>
  <line x1="757" y1="300" x2="841" y2="300" stroke="#2563EB" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="800" y="286" font-size="15" fill="#6B7280" text-anchor="middle">PR</text>
  <line x1="1147" y1="300" x2="1231" y2="300" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
  <text x="1190" y="286" font-size="15" fill="#059669" text-anchor="middle">pass</text>

  <!-- fail loop back -->
  <path d="M 995 452 L 995 510 Q 995 525 980 525 L 620 525 Q 605 525 605 510 L 605 456" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a-red)"/>
  <rect x="712" y="510" width="176" height="30" rx="8" fill="#FFFFFF"/>
  <text x="800" y="531" font-size="16" fill="#DC2626" text-anchor="middle">fail: back to agent</text>

  <!-- analogy row -->
  <line x1="65" y1="600" x2="1535" y2="600" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="65" y="632" font-size="15" font-weight="600" fill="#6B7280" letter-spacing="1">IN A FACTORY</text>
  <text x="89" y="672" font-size="18" fill="#1F2937">Work order</text>
  <text x="89" y="698" font-size="16" fill="#6B7280">what to make</text>
  <text x="479" y="672" font-size="18" fill="#1F2937">Machinist</text>
  <text x="479" y="698" font-size="16" fill="#6B7280">makes the part</text>
  <text x="869" y="672" font-size="18" fill="#1F2937">Inspector</text>
  <text x="869" y="698" font-size="16" fill="#6B7280">is never the machinist</text>
  <text x="1259" y="672" font-size="18" fill="#1F2937">Foreman</text>
  <text x="1259" y="698" font-size="16" fill="#6B7280">decides if it ships</text>

  <!-- limitation note -->
  <rect x="455" y="770" width="690" height="64" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="490" cy="802" r="13" fill="#D97706"/>
  <text x="490" y="808" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="516" y="808" font-size="18" fill="#1F2937">Works for one ticket. <tspan fill="#B45309" font-weight="600">Breaks when many run at once.</tspan></text>
  </g>
</svg>
