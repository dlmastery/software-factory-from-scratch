<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2563EB"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <g transform="translate(85,0)">
  <text x="60" y="116" font-size="15" font-weight="600" fill="#DC2626" letter-spacing="1">FAILURE</text>
  <text x="520" y="116" font-size="15" font-weight="600" fill="#059669" letter-spacing="1">STRUCTURAL FIX</text>
  <text x="1210" y="116" font-size="15" font-weight="600" fill="#6B7280" letter-spacing="1">IN THE PLANT</text>
  <g>
    <rect x="60" y="136" width="340" height="108" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="84" y="182" font-size="20" font-weight="700" fill="#1F2937">Files overwritten</text>
    <text x="84" y="210" font-size="16" fill="#6B7280">agents clobber each other</text>
    <line x1="404" y1="190.0" x2="512" y2="190.0" stroke="#2563EB" stroke-width="2" marker-end="url(#a-blue)"/>
    <rect x="520" y="136" width="620" height="108" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="544" y="172" font-size="20" font-weight="700" fill="#1F2937">Sandbox per agent</text>
    <text x="544" y="200" font-size="17" fill="#1F2937">each agent works in its own isolated copy</text>
    <text x="544" y="228" font-size="16" font-weight="600" fill="#059669">&#x2713;  no file collisions</text>
    <line x1="1144" y1="190.0" x2="1196" y2="190.0" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3 5"/>
    <text x="1210" y="184.0" font-size="17" fill="#1F2937" font-style="italic">Each machinist gets</text>
    <text x="1210" y="208.0" font-size="17" fill="#6B7280" font-style="italic">a private workshop</text>
  </g>
  <g>
    <rect x="60" y="262" width="340" height="108" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="84" y="308" font-size="20" font-weight="700" fill="#1F2937">Same issue taken twice</text>
    <text x="84" y="336" font-size="16" fill="#6B7280">two agents, one ticket</text>
    <line x1="404" y1="316.0" x2="512" y2="316.0" stroke="#2563EB" stroke-width="2" marker-end="url(#a-blue)"/>
    <rect x="520" y="262" width="620" height="108" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="544" y="298" font-size="20" font-weight="700" fill="#1F2937">Claim label on the issue</text>
    <text x="544" y="326" font-size="17" fill="#1F2937">first to add</text>
    <rect x="645" y="307" width="176" height="27" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <text x="733" y="326" font-size="16" fill="#065F46" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace">factory:claimed</text>
    <text x="833" y="326" font-size="17" fill="#1F2937">owns it; others skip it</text>
    <text x="544" y="354" font-size="16" font-weight="600" fill="#059669">&#x2713;  no double work</text>
    <line x1="1144" y1="316.0" x2="1196" y2="316.0" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3 5"/>
    <text x="1210" y="310.0" font-size="17" fill="#1F2937" font-style="italic">Work order stamped</text>
    <text x="1210" y="334.0" font-size="17" fill="#6B7280" font-style="italic">“taken” at the desk</text>
  </g>
  <g>
    <rect x="60" y="388" width="340" height="108" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="84" y="434" font-size="20" font-weight="700" fill="#1F2937">Self-graded “pass”</text>
    <text x="84" y="462" font-size="16" fill="#6B7280">agent marks its own work</text>
    <line x1="404" y1="442.0" x2="512" y2="442.0" stroke="#2563EB" stroke-width="2" marker-end="url(#a-blue)"/>
    <rect x="520" y="388" width="620" height="108" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="544" y="424" font-size="20" font-weight="700" fill="#1F2937">Separate verifier + reviewer</text>
    <text x="544" y="452" font-size="17" fill="#1F2937">another process re-tests and reads the diff</text>
    <text x="544" y="480" font-size="16" font-weight="600" fill="#059669">&#x2713;  no self-grading</text>
    <line x1="1144" y1="442.0" x2="1196" y2="442.0" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3 5"/>
    <text x="1210" y="436.0" font-size="17" fill="#1F2937" font-style="italic">The inspector is never</text>
    <text x="1210" y="460.0" font-size="17" fill="#6B7280" font-style="italic">the machinist</text>
  </g>
  <g>
    <rect x="60" y="514" width="340" height="108" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="84" y="560" font-size="20" font-weight="700" fill="#1F2937">Stale training data</text>
    <text x="84" y="588" font-size="16" fill="#6B7280">APIs changed since training</text>
    <line x1="404" y1="568.0" x2="512" y2="568.0" stroke="#2563EB" stroke-width="2" marker-end="url(#a-blue)"/>
    <rect x="520" y="514" width="620" height="108" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="544" y="550" font-size="20" font-weight="700" fill="#1F2937">Live docs via Context7</text>
    <text x="544" y="578" font-size="17" fill="#1F2937">agent looks up current library docs</text>
    <text x="544" y="606" font-size="16" font-weight="600" fill="#059669">&#x2713;  no stale knowledge</text>
    <line x1="1144" y1="568.0" x2="1196" y2="568.0" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3 5"/>
    <text x="1210" y="562.0" font-size="17" fill="#1F2937" font-style="italic">Current manuals kept</text>
    <text x="1210" y="586.0" font-size="17" fill="#6B7280" font-style="italic">at every bench</text>
  </g>
  <g>
    <rect x="60" y="640" width="340" height="108" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="84" y="686" font-size="20" font-weight="700" fill="#1F2937">PR flood</text>
    <text x="84" y="714" font-size="16" fill="#6B7280">conflicts dumped on a human</text>
    <line x1="404" y1="694.0" x2="512" y2="694.0" stroke="#2563EB" stroke-width="2" marker-end="url(#a-blue)"/>
    <rect x="520" y="640" width="620" height="108" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="544" y="676" font-size="20" font-weight="700" fill="#1F2937">Integrator, then human</text>
    <text x="544" y="704" font-size="17" fill="#1F2937">approved PRs merged one by one; a person merges</text>
    <text x="544" y="732" font-size="16" font-weight="600" fill="#059669">&#x2713;  no PR flood</text>
    <line x1="1144" y1="694.0" x2="1196" y2="694.0" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3 5"/>
    <text x="1210" y="688.0" font-size="17" fill="#1F2937" font-style="italic">One assembly line;</text>
    <text x="1210" y="712.0" font-size="17" fill="#6B7280" font-style="italic">the foreman signs off</text>
  </g>
  <rect x="520" y="788" width="620" height="60" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="830" y="825" font-size="19" fill="#1F2937" text-anchor="middle">Process constraints, <tspan font-weight="700">not prompt tricks.</tspan></text>
  </g>
</svg>